<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hackathon Registration</title>
  <link rel="stylesheet" href="./styles-a.css" />
</head>
<body>
  <main class="page">
    <section class="card">
      <header class="card-head">
        <h1>Hackathon Registration Form</h1>
        <p>Please complete your registration details.</p>
      </header>

      <form id="registrationForm" class="form-shell" novalidate>
        <div class="row-list">
          <div class="field-container"><label for="field-1">Participant Name</label><input id="field-1" name="input_1" autocomplete="name" /></div>
          <div class="field-container"><label for="field-2">Primary Contact Email</label><input id="field-2" name="input_2" autocomplete="email" /></div>
          <div class="field-container"><label for="field-3">Faculty Cluster</label><input id="field-3" name="input_3" autocomplete="off" /></div>
          <div class="field-container"><label for="field-4">Mobile Contact</label><input id="field-4" name="input_4" autocomplete="tel" /></div>
          <div class="field-container"><label for="field-5">Portfolio Alias</label><input id="field-5" name="input_5" autocomplete="off" /></div>
          <div class="field-container"><label for="field-6">Campus Institution</label><input id="field-6" name="input_6" autocomplete="organization" /></div>
          <div class="field-container"><label for="field-7">Initiative Tagline</label><input id="field-7" name="input_7" autocomplete="off" /></div>
          <div class="field-container"><label for="field-8">Academic Track</label><input id="field-8" name="input_8" autocomplete="off" /></div>
        </div>
        <div class="submit-wrap">
          <button type="submit">Submit &amp; Verify you are not an AI</button>
        </div>
        <div class="result-banner" id="resultBanner"></div>
      </form>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
